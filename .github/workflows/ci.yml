name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content check (frontmatter, pairing, no reviewer notes)
        run: npm run check:content
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
