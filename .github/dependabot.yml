version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    ignore:
      # Major npm upgrades (Next, React, TypeScript, ESLint...) are done deliberately, not weekly
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
